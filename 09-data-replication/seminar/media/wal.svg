@startuml


left to right direction


!include ../style.puml

map Client {
}

map KVStore {
}

map Log {
1=>Set(key1, value1)
2=>Set(key2, value4)
3=>Set(key3, value3)
4=>Set(key4, value4)
}

note right of Log
Write Ahead Log
/var/log/wal000.log
end note

map Storage {
key1=>value1
key2=>value2
key3=>value3
key4=>value4

}



Client - -> KVStore: Set(key4, value4)
KVStore -r-> Log: 1. Append
KVStore -d-> Storage: 2. Set(Key4, Value4)

@enduml

